version: "3.9"

services:
  backend:
    build: ./backend
    container_name: geoinsight_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./geoinsight.db
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80
      - MAX_UPLOAD_SIZE_MB=100
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: geoinsight_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
